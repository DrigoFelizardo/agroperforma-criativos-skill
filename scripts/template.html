<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Helvetica Now Display";
        src: url("fonts/HelveticaNowDisplay-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
      }
      /* Themes: AgroPerforma = green, FábricaBlindada = blue */
      :root[data-theme="green"] { --ap-primary: #62ae46; --ap-secondary: #173f12; --ap-accent: #62ae46; }
      :root[data-theme="blue"] { --ap-primary: #1f4cd7; --ap-secondary: #0c1f51; --ap-accent: #1f4cd7; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05070d; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Helvetica Now Display", sans-serif;
        font-weight: 700;
      }
      #cam { position: absolute; inset: 0; transform-origin: 50% 27%; }
      .footage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #degrade { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }

      /* Static caption, middle of frame */
      #captions { position: absolute; left: 80px; right: 80px; top: 0; height: 1920px; }
      .cap {
        position: absolute;
        left: 0;
        right: 0;
        top: 960px;
        transform: translateY(-50%);
        text-align: center;
        color: #fff;
        font-size: 76px;
        line-height: 1.08;
        letter-spacing: -0.035em;
        text-shadow: 0 4px 22px rgba(0, 0, 0, 0.6), 0 2px 4px rgba(0, 0, 0, 0.55);
        /* thin dark outline behind the fill keeps white captions readable on white boards/shirts */
        -webkit-text-stroke: 6px rgba(0, 0, 0, 0.55);
        paint-order: stroke fill;
        visibility: hidden;
      }

      /* Motion tags (IDEIA-MOTION prints) */
      .stack { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .tag {
        display: block;
        padding: 18px 34px 15px;
        color: #fff;
        font-size: 68px;
        line-height: 1;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        white-space: nowrap;
        background: var(--ap-primary);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .tag.secondary { background: var(--ap-secondary); font-size: 58px; text-shadow: none; }
      .tag.small { font-size: 52px; }
      .tag span { display: flex; align-items: center; gap: 18px; }
      .ring-wrap { position: relative; display: block; }
      .ring { position: absolute; left: -64px; top: -44px; width: calc(100% + 128px); height: calc(100% + 88px); overflow: visible; }
      .check { display: block; flex: none; width: 50px; height: 50px; margin-top: -4px; overflow: visible; }
      .arrow { display: block; width: 90px; height: 250px; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
      <div id="track" style="position:absolute;inset:0">
      <div id="cam">
        <div id="stab" style="position:absolute;inset:0">
        <!-- One pre-joined, frame-aligned cut (see media/cut.json) — a single element keeps the LUT on every frame -->
        <video id="shot" class="footage" src="media/cut.mp4" data-start="0" data-duration="__DURATION__" data-media-start="0" data-track-index="0" playsinline data-has-audio="true"
          data-color-grading='{"intensity":1,"adjust":__ADJUST__,"lut":{"src":".media/luts/lut_001.cube","intensity":1},"colorSpace":"rec709"}'></video>
        </div>
      </div>
      </div>
      <img id="degrade" class="clip" src="media/fundo-degrade.png" alt="" data-start="0" data-duration="__DURATION__" data-track-index="1" />
      <div id="motions" style="position:absolute;inset:0"></div>
      <div id="captions" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="3"></div>
    </div>

    <script>
      const CONFIG = __CONFIG__;

      document.documentElement.dataset.theme = CONFIG.theme;
      const SVGNS = "http://www.w3.org/2000/svg";
      const ACCENT = CONFIG.theme === "green" ? "#62ae46" : "#1f4cd7";
      const tl = gsap.timeline({ paused: true });

      // ---------- Camera: punch-in per cut + face re-centre (x = s·(540 − faceX), ≤ 540·(s − 1)) ----------
      const centreX = (s, cx) => {
        const want = s * (540 - cx * 1080), lim = 540 * (s - 1);
        return Math.max(-lim, Math.min(lim, want));
      };
      // c.s = scale at the cut; c.to = scale at the end of the shot (push in when > s, pull out when < s)
      const shotScale = (t) => {
        const c = CONFIG.cam.find((k) => t >= k.start && t < k.end) || CONFIG.cam[CONFIG.cam.length - 1];
        const s1 = c.to !== undefined ? c.to : c.s + 0.04;
        return c.s + (s1 - c.s) * Math.min(1, Math.max(0, (t - c.start) / (c.end - c.start)));
      };
      CONFIG.cam.forEach((c, i) => {
        const s1 = c.to !== undefined ? c.to : c.s + 0.04;
        tl.fromTo("#cam", { scale: c.s }, { scale: s1, duration: c.end - c.start, ease: "none", immediateRender: i === 0 }, c.start);
      });
      // Face tracking on #track (outside the scale), evaluated PER FRAME: x = s(t)·(540 − faceX(t)),
      // always clamped to the margin the zoom of THAT frame really has (minus 2 px) — never shows the frame edge.
      if (CONFIG.trackMode === "shot") {
        // calmer framing: one centring per zoom shot (c.cx = mean face x of that shot), no lateral jumps at jump cuts
        const FPS = 24;
        for (let f = 0; f <= Math.ceil(CONFIG.duration * FPS); f++) {
          const t = f / FPS, c = CONFIG.cam.find((k) => t >= k.start && t < k.end) || CONFIG.cam[CONFIG.cam.length - 1];
          const s = shotScale(t + 0.0005), lim = Math.max(0, 540 * (s - 1) - 2);
          tl.set("#track", { x: Math.max(-lim, Math.min(lim, s * (540 - c.cx * 1080))) }, t);
        }
      } else if (CONFIG.track) {
        const keys = CONFIG.track, FPS = 24;
        const faceAt = (t) => {
          let k = 0;
          while (k + 1 < keys.length && keys[k + 1][0] <= t) k++;
          const [t0, c0] = keys[k], nxt = keys[k + 1];
          if (!nxt || nxt[2]) return c0;            // next key is a cut: hold until it
          const u = (t - t0) / (nxt[0] - t0);
          return c0 + (nxt[1] - c0) * Math.min(1, Math.max(0, u));
        };
        for (let f = 0; f <= Math.ceil(CONFIG.duration * FPS); f++) {
          const t = f / FPS, s = shotScale(t + 0.0005), lim = Math.max(0, 540 * (s - 1) - 2);
          const want = s * (540 - faceAt(t) * 1080);
          tl.set("#track", { x: Math.max(-lim, Math.min(lim, want)) }, t);
        }
      } else {
        CONFIG.cam.forEach((c) => tl.set("#track", { x: centreX(c.s, c.cx) }, c.start));
      }

      // ---------- Optional stabilisation: per-frame x/y correction (px) on #stab, zoomed to hide edges ----------
      if (CONFIG.stab) {
        const st = CONFIG.stab;
        gsap.set("#stab", { scale: st.zoom });
        st.x.forEach((x, f) => tl.set("#stab", { x, y: st.y[f] }, f / st.fps));
      }

      // ---------- Motions ----------
      const mBox = document.getElementById("motions");
      const tagIn = (el, at) => {
        tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", y: 12 }, { clipPath: "inset(0% 0% 0% 0%)", y: 0, duration: 0.42, ease: "expo.out" }, at);
        tl.fromTo(el.firstChild, { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, at + 0.06);
      };
      const drawPath = (p, at, dur) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(p, { opacity: 1 }, at);
        tl.to(p, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at);
      };
      CONFIG.motions.forEach((m, mi) => {
        const stack = document.createElement("div");
        stack.className = "stack";
        stack.id = "stack-" + mi;
        stack.style.top = m.top + "px";
        mBox.appendChild(stack);
        m.items.forEach((it, ii) => {
          const tag = document.createElement("div");
          tag.className = "tag" + (it.kind === "secondary" ? " secondary" : "") + (it.small ? " small" : "");
          tag.id = `m${mi}-t${ii}`;
          const span = document.createElement("span");
          let mark = null, bg = null;
          if (it.check) {
            const svg = document.createElementNS(SVGNS, "svg");
            svg.setAttribute("viewBox", "0 0 50 50");
            svg.setAttribute("class", "check");
            bg = document.createElementNS(SVGNS, "circle");
            bg.setAttribute("cx", "25"); bg.setAttribute("cy", "25"); bg.setAttribute("r", "25");
            bg.setAttribute("fill", it.kind === "secondary" ? ACCENT : "#ffffff");
            mark = document.createElementNS(SVGNS, "path");
            mark.setAttribute("d", "M 14 26 L 22 34 L 37 17");
            mark.setAttribute("fill", "none");
            mark.setAttribute("stroke", it.kind === "secondary" ? "#ffffff" : ACCENT);
            mark.setAttribute("stroke-width", "6");
            mark.setAttribute("stroke-linecap", "round");
            mark.setAttribute("stroke-linejoin", "round");
            svg.appendChild(bg); svg.appendChild(mark); span.appendChild(svg);
          }
          span.appendChild(document.createTextNode(it.text));
          tag.appendChild(span);
          gsap.set(tag, { clipPath: "inset(0% 100% 0% 0%)" });
          let host = tag;
          if (it.ring !== undefined) {
            host = document.createElement("div");
            host.className = "ring-wrap";
            host.appendChild(tag);
            const svg = document.createElementNS(SVGNS, "svg");
            svg.setAttribute("viewBox", "0 0 860 186");
            svg.setAttribute("preserveAspectRatio", "none");
            svg.setAttribute("class", "ring");
            const p = document.createElementNS(SVGNS, "path");
            p.setAttribute("d", "M 60 108 C 40 30, 330 12, 450 14 C 640 16, 830 38, 826 96 C 822 160, 560 178, 420 176 C 230 174, 30 160, 34 98 C 37 64, 90 40, 150 32");
            p.setAttribute("fill", "none"); p.setAttribute("stroke", ACCENT); p.setAttribute("stroke-width", "8");
            p.setAttribute("vector-effect", "non-scaling-stroke"); p.setAttribute("stroke-linecap", "round");
            svg.appendChild(p); host.appendChild(svg);
            drawPath(p, it.ring, 0.6);
          }
          stack.appendChild(host);
          tagIn(tag, it.at);
          if (mark) {
            tl.fromTo(bg, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, it.at + 0.1);
            drawPath(mark, it.at + 0.3, 0.28);
          }
        });
        if (m.arrow !== undefined) {
          const svg = document.createElementNS(SVGNS, "svg");
          svg.setAttribute("viewBox", "0 0 90 250");
          svg.setAttribute("class", "arrow");
          const line = document.createElementNS(SVGNS, "path");
          line.setAttribute("d", "M 45 6 L 45 236");
          const head = document.createElementNS(SVGNS, "path");
          head.setAttribute("d", "M 14 200 L 45 240 L 76 200");
          [line, head].forEach((p) => {
            p.setAttribute("fill", "none"); p.setAttribute("stroke", ACCENT); p.setAttribute("stroke-width", "9");
            p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round"); svg.appendChild(p);
          });
          stack.appendChild(svg);
          drawPath(line, m.arrow, 0.4);
          drawPath(head, m.arrow + 0.33, 0.2);
          tl.fromTo(svg, { y: 0 }, { y: 22, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, m.arrow + 0.6);
        }
        if (m.end < CONFIG.duration - 0.05) tl.to(stack, { opacity: 0, y: 20, duration: 0.22, ease: "power2.in" }, m.end - 0.22);
      });

      // ---------- Static captions, hidden while any motion is on screen ----------
      // visible = [start, end) minus every motion window
      const visibleSpans = (start, end) => {
        let spans = [[start, end]];
        CONFIG.motions.forEach((m) => {
          spans = spans.flatMap(([a, b]) => {
            if (m.end <= a || m.start >= b) return [[a, b]];
            const out = [];
            if (m.start > a) out.push([a, m.start]);
            if (m.end < b) out.push([m.end, b]);
            return out;
          });
        });
        return spans.filter(([a, b]) => b - a >= 0.15);
      };
      const cBox = document.getElementById("captions");
      CONFIG.captions.forEach(([text, start, end], i) => {
        const spans = visibleSpans(start, end);
        if (!spans.length) return;
        const el = document.createElement("div");
        el.className = "cap";
        el.id = "cap-" + i;
        el.textContent = text;
        cBox.appendChild(el);
        spans.forEach(([a, b]) => {
          tl.set(el, { visibility: "visible" }, a);
          tl.set(el, { visibility: "hidden" }, b);
        });
      });

      tl.set({}, {}, CONFIG.duration);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
